    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Cuánto cuesta el sistema de punto de venta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "El POS tiene un único plan de $45 al mes por sucursal, con todo incluido: sin versiones recortadas ni cobros por función. Agenda de Citas cuesta $30 al mes y Cartera de Cobro (fiado) $25 al mes, por negocio. Delivery no tiene costo fijo: se paga una comisión por entrega según tu volumen."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué incluye la cuota mensual?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hosting, soporte técnico y todas las actualizaciones del sistema, sin costo extra. Cuando sacamos mejoras, las recibís sin pagar de más."
            }
          },
          {
            "@type": "Question",
            "name": "¿Necesito comprar equipo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No es obligatorio. El sistema funciona con impresoras térmicas USB o de red y gavetas de dinero RJ11. Si preferís no complicarte, tenemos un kit listo (computadora con monitor, teclado y mouse, impresora de recibos y caja registradora y lector de código de barras, instalados y configurados) desde $750; el equipo queda a tu nombre y hay arreglos de pago."
            }
          },
          {
            "@type": "Question",
            "name": "¿Funciona si se cae el internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En negocios con una sola caja podés seguir cobrando sin conexión; las ventas se guardan y se sincronizan cuando vuelve el internet."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo cobrar en dólares?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Podés cobrar en córdobas o en dólares, y el vuelto sale en córdobas con la tasa de cambio que vos definís en el sistema."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo controlo lo que hacen mis empleados en la caja?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cada cajero cuenta su efectivo al cerrar sin ver lo que debería haber (cierre ciego), y el sistema te muestra la diferencia. Anular una venta o hacer una devolución requiere la autorización del encargado, y queda registrado quién lo hizo y quién lo aprobó."
            }
          },
          {
            "@type": "Question",
            "name": "¿Sirve para restaurantes y cafeterías?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. El mismo sistema maneja mesas y permite que tus meseros tomen pedidos desde el teléfono o una tablet; no necesitás otra aplicación."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo pasar mis productos desde Excel?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Podés importar tu catálogo desde un archivo de Excel y exportarlo cuando lo necesités."
            }
          },
          {
            "@type": "Question",
            "name": "¿Emite comprobantes fiscales?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "NEXOL POS emite tickets y comprobantes de venta para control interno del negocio. La facturación fiscal electrónica de la DGI no está incluida; si tu comercio la requiere, escribinos por WhatsApp y evaluamos tu caso."
            }
          },
          {
            "@type": "Question",
            "name": "¿En cuánto tiempo está listo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "El POS, las Citas y la Cartera de Cobro se activan en 1 semana. Un sitio web se entrega en 1 a 3 semanas. Los sistemas a medida toman de 3 a 5 semanas, y los proyectos más grandes de 1 a 3 meses, con comunicación directa en cada avance."
            }
          },
          {
            "@type": "Question",
            "name": "¿Ofrecen soporte después de la entrega?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. No desaparecemos después de entregar: todos nuestros planes incluyen soporte técnico, y tu sistema evoluciona con tu negocio."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuánto cuesta una página web o un sistema a medida?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Un sitio web profesional parte desde $300 (pago único) e incluye 2 meses de soporte y mantenimiento; después son $30 al mes. Los sistemas a medida se cotizan según lo que necesites: escribinos y te damos una cotización sin compromiso."
            }
          },
          {
            "@type": "Question",
            "name": "¿Trabajan solo con empresas de Nicaragua?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, trabajamos con clientes de toda Latinoamérica y el mundo. Somos de Nicaragua, pero nuestros sistemas no tienen fronteras."
            }
          }
        ]
      }
